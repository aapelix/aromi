<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>aromi</title>
</head>
<body>
{{- range .Days -}}
{{- if eq (.Date.Format "2006-01-02") $.Today -}}
<h1>{{ .DateString }}</h1>

{{ range .Meals }}
<h2>{{ .Name }}</h2>

{{ range .Dishes }}
<p>{{ .Name }}{{ with .Details }} ({{ . }}){{ end }}</p>
{{ end }}

{{ end }}
{{- end -}}
{{- end -}}
</body>
</html>
